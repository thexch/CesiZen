name: CI CESIZen

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Tests et build du backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # Valeurs fictives utilisées uniquement pendant la CI.
      AUTH_SECRET: github-actions-test-secret-not-for-production
      DATABASE_URL: postgresql://user:password@localhost:5432/cesizen?schema=public
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer Prisma Client
        run: npx prisma generate

      - name: Lancer les tests du backend
        run: npm test

      - name: Compiler le backend
        run: npm run build

  frontend:
    name: Tests et build du frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:3000

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests du frontend
        run: npm test

      - name: Compiler le frontend
        run: npm run build